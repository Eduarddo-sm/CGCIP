version: 2
updates:
  - package-ecosystem: pip
    directory: "/aplicacao-gerencial"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gerencial-python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/aplicacao-negocial"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      negocial-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/aplicacao-gerencial"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gerencial-node:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/aplicacao-negocial"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      negocial-node:
        patterns: ["*"]
