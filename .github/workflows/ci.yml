name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aplicacao-gerencial/requirements.txt
            aplicacao-negocial/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            aplicacao-gerencial/package-lock.json
            aplicacao-negocial/package-lock.json
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m venv aplicacao-gerencial/.venv
          python -m venv aplicacao-negocial/.venv
          aplicacao-gerencial/.venv/Scripts/python -m pip install -r aplicacao-gerencial/requirements.txt
          aplicacao-negocial/.venv/Scripts/python -m pip install -r aplicacao-negocial/requirements.txt
      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          npm ci --prefix aplicacao-gerencial
          npm ci --prefix aplicacao-negocial
      - name: Run project checks
        shell: pwsh
        run: ./scripts/check-project.ps1

  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit dependencies
        shell: pwsh
        run: |
          pip install pip-audit
          pip-audit -r aplicacao-gerencial/requirements.txt
          pip-audit -r aplicacao-negocial/requirements.txt
          npm audit --omit=dev --prefix aplicacao-gerencial
          npm audit --omit=dev --prefix aplicacao-negocial
